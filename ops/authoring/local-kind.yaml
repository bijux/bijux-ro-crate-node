apiVersion: v1
kind: Namespace
metadata:
  name: bia-authoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authoring
  namespace: bia-authoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authoring
  template:
    metadata:
      labels:
        app: authoring
    spec:
      containers:
        - name: authoring
          image: bijux-authoring-local:kind
          imagePullPolicy: Never
          ports:
            - containerPort: 4321
          readinessProbe:
            httpGet:
              path: /
              port: 4321
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: authoring
  namespace: bia-authoring
spec:
  selector:
    app: authoring
  ports:
    - port: 4321
      targetPort: 4321
