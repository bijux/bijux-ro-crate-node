name: Local reference submission
'on':
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: local-reference-submission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      submission:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: reference
          POSTGRES_DB: reference
        ports:
        - 127.0.0.1:15440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reference"
          --health-interval 2s --health-timeout 2s --health-retries 30
      receiver:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: reference
          POSTGRES_DB: reference
        ports:
        - 127.0.0.1:15441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reference"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      BIJUX_SUBMISSION_DISPOSABLE: bijux-submission-postgres
      SUBMISSION_DATABASE_URL: postgresql://postgres:reference@127.0.0.1:15440/reference
      BIJUX_REFERENCE_DISPOSABLE: bijux-reference-postgres
      REFERENCE_DATABASE_URL: postgresql://postgres:reference@127.0.0.1:15441/reference
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - run: mkdir -p artifacts/work && echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - run: npm ci
    - run: npm run build
    - run: npm run test:local-reference-store --workspace @bijux/ro-crate-web
  reference-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright
      BIJUX_REFERENCE_DISPOSABLE: bijux-reference-postgres
      BIJUX_REFERENCE_CONTAINER: bijuxreferencesubmission-receiver-db
      REFERENCE_DATABASE_URL: postgresql://postgres:reference@127.0.0.1:15441/reference
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - run: mkdir -p artifacts/work artifacts/reference-services && echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build && npm run build --workspace @bijux/ro-crate-web
    - name: Start isolated reference services
      run: |
        sed 's/14321/14325/g' ops/local-authoring/realm.json > artifacts/reference-services/realm.json
        sed -e 's/15433/15440/g' -e 's/18080/18085/g' ops/local-authoring/compose.yaml > artifacts/reference-services/compose.yaml
        docker compose -p bijuxreferencesubmission -f artifacts/reference-services/compose.yaml up -d --wait
        docker run -d --name bijuxreferencesubmission-receiver-db --label bijux.fixture=reference-receiver-postgres -e POSTGRES_PASSWORD=reference -e POSTGRES_DB=reference -p 127.0.0.1:15441:5432 postgres:17.12
        for attempt in {1..90}; do
          if curl -fsS http://127.0.0.1:18085/realms/authoring/.well-known/openid-configuration >/dev/null && docker exec bijuxreferencesubmission-receiver-db pg_isready -U postgres -d reference; then exit 0; fi
          sleep 1
        done
        exit 1
    - run: npm run test:local-reference-browser --workspace @bijux/ro-crate-web
