name: Package candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.23.4
        - 24.3.0
        shard: [1, 2, 3]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - run: npm ci
    - run: npm run build
    - if: ${{ matrix.shard == 1 }}
      run: npm test --workspace @bijux/ro-crate-core
    - if: ${{ matrix.shard == 1 }}
      run: npm test --workspace @bijux/ro-crate-creator
    - run: npm test --workspace @bijux/ro-crate-validator -- --test-shard=${{ matrix.shard }}/3
  root-tests:
    needs:
    - assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.23.4
        - 24.3.0
        lane: [ordinary-1, ordinary-2, workspace-build, installed-workspaces-contracts, installed-workspaces-scenarios, installed-workspaces-assets, compiler-contract]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/logs
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - if: ${{ startsWith(matrix.lane, 'ordinary-') }}
      run: npm run build
    - run: node scripts/ci/root-test-shards.mjs ${{ matrix.lane }}
  source-reports:
    needs:
    - assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.23.4
        - 24.3.0
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - run: npm run check:workspace
    - run: node --import tsx tests/package/native-inputs.mjs > artifacts/reports/source-native-inputs.json
    - run: node --import tsx tests/reference/literal-grammar/run.mjs > artifacts/reports/source-literal-grammar.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-packages-${{ matrix.node }}
        path: artifacts/reports
        if-no-files-found: error
        compression-level: 0
  package-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.23.4
        - 24.3.0
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - run: npm ci
    - run: npm run build
    - run: npm run check:types
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
      producer_attempt: ${{ steps.bundle.outputs.producer_attempt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |-
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.3.0
    - run: npm ci
    - run: |-
        npm run build
        node scripts/release/pack.mjs
        node tests/package/consumers.mjs --prepare
    - id: bundle
      run: node scripts/ci/runtime-bundles.mjs pack assets
    - id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-assets-runtime-${{ github.run_attempt }}
        path: artifacts/ci/assets.tar.gz
        if-no-files-found: error
        compression-level: 0
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-preparation
        path: artifacts/reports
        if-no-files-found: error
        compression-level: 0
  source-parity:
    needs:
    - assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Source parity / node-${{ matrix.node }}
    env:
      BIJUX_TEST_NODE: ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.23.4
        - 24.3.0
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |-
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - run: node tests/package/consumers.mjs --verify
    - run: node tests/package/source.mjs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-source-node-${{ matrix.node }}
        path: artifacts/reports/source-package-node*.json
        if-no-files-found: error
        compression-level: 0
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: candidate-source-partitions-${{ matrix.node }}
        path: artifacts/reports/snapshot-partitions
        if-no-files-found: error
        compression-level: 0
  browser-corpus:
    needs:
    - assets
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0
      options: --init --shm-size=1g --user pwuser
    defaults:
      run:
        shell: bash
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BIJUX_TEST_ENGINE: ${{ matrix.engine }}
      BIJUX_TEST_SHARD: ${{ matrix.shard }}/8
    strategy:
      fail-fast: false
      matrix:
        engine:
        - chromium
        - firefox
        - webkit
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Trust the mounted checkout
      run: git config --global --add safe.directory "$PWD"
    - run: |-
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.3.0
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - run: node tests/package/consumers.mjs --verify
    - run: node --import tsx scripts/ci/browser-runtime.mts
    - run: node --import tsx scripts/ci/browser-checks.mjs corpus
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-browser-corpus-${{ matrix.engine }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
        path: artifacts/reports
        if-no-files-found: error
        compression-level: 0
      if: ${{ always() }}
  browser-interaction:
    needs:
    - assets
    name: Browser interaction / ${{ matrix.engine }} / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0
      options: --init --shm-size=1g --user pwuser
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BIJUX_TEST_ENGINE: ${{ matrix.engine }}
      BIJUX_TEST_INTERACTION: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        engine:
        - chromium
        - firefox
        - webkit
        lane:
        - source-0
        - source-1
        - source-2
        - installed-references
        - installed-sessions
        - installed-inputs
        - installed-apps
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Trust the mounted checkout
      run: git config --global --add safe.directory "$PWD"
    - run: |-
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.3.0
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - if: startsWith(matrix.lane, 'source-')
      run: node tests/package/consumers.mjs --verify
    - run: node --import tsx scripts/ci/browser-runtime.mts
    - run: node --import tsx scripts/ci/browser-checks.mjs interaction
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-browser-interaction-${{ matrix.engine }}-${{ matrix.lane }}
        path: artifacts/reports
        if-no-files-found: error
        compression-level: 0
      if: ${{ always() }}
  installed:
    needs:
    - assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BIJUX_TEST_NODE: ${{ matrix.node }}
      BIJUX_TEST_INSTALLED_NODE_LANE: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [snapshot, references]
        node:
        - 22.23.4
        - 24.3.0
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |-
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - run: node tests/package/consumers.mjs --node
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: candidate-installed-node-${{ matrix.node }}-${{ matrix.lane }}
        path: artifacts/reports
        if-no-files-found: error
        compression-level: 0
      if: ${{ always() }}
  authoring-web:
    name: Authoring web / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0
      options: --init --shm-size=1g --user pwuser
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
        - 22.23.4
        - 24.3.0
        lane: [core, recovery, entity, specimen, listings]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BIJUX_TEST_ENGINE: chromium
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/logs
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node }}
    - run: npm ci
    - run: node --import tsx scripts/ci/browser-runtime.mts --authoring
    - run: npm run build
    - run: node --import tsx apps/web/authoring-lanes.mts
    - run: npm run check --workspace @bijux/ro-crate-web
      if: ${{ matrix.lane == 'core' }}
    - run: npm run test --workspace @bijux/ro-crate-web
      if: ${{ matrix.lane == 'core' }}
    - run: npm run build --workspace @bijux/ro-crate-web
      if: ${{ matrix.lane != 'core' }}
    - run: npm run test:e2e:${{ matrix.lane }} --workspace @bijux/ro-crate-web
  local-registration:
    name: Local account / registration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/playwright
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/artifacts/playwright" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - run: npm ci
    - run: npm run build
    - run: bash scripts/ci/install-ubuntu-browser.sh
    - run: npm run build --workspace @bijux/ro-crate-web
    - run: npm run test:local-registration --workspace @bijux/ro-crate-web
  local-account:
    name: Local account / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lane: [store, browser, history-store, history-browser, reference-store, reference-browser]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |
        mkdir -p artifacts/work artifacts/playwright
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$PWD/artifacts/playwright" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - run: npm ci
    - run: npm run build
    - if: ${{ matrix.lane == 'browser' || matrix.lane == 'history-browser' || matrix.lane == 'reference-browser' }}
      run: bash scripts/ci/install-ubuntu-browser.sh
    - if: ${{ matrix.lane == 'browser' || matrix.lane == 'history-browser' || matrix.lane == 'reference-browser' }}
      run: npm run build --workspace @bijux/ro-crate-web
    - if: ${{ matrix.lane == 'store' }}
      run: |
        docker compose -p bijuxauthoringaccounts -f ops/local-authoring/compose.yaml up -d --wait database
        docker run -d --name bijuxauthoring-accounts-test-postgres -e POSTGRES_PASSWORD=local-reference -e POSTGRES_DB=drafts postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        for attempt in $(seq 1 60); do
          if docker exec bijuxauthoring-accounts-test-postgres pg_isready -U postgres -d drafts >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        exit 1
    - if: ${{ matrix.lane == 'browser' }}
      run: |
        docker compose -p bijuxauthoringaccounts -f ops/local-authoring/compose.yaml up -d --wait
        for attempt in $(seq 1 90); do
          if curl --fail --silent http://127.0.0.1:18080/realms/authoring/.well-known/openid-configuration >/dev/null; then exit 0; fi
          sleep 1
        done
        exit 1
    - if: ${{ matrix.lane == 'store' }}
      run: |
        DRAFT_REFERENCE_DATABASE_CONTAINER=bijuxauthoringaccounts-database-1 npm run test:local-migrations --workspace @bijux/ro-crate-web
        DRAFT_TEST_POSTGRES=bijuxauthoring-accounts-test-postgres npm run test:local-persistence --workspace @bijux/ro-crate-web
        npm run test:local-backup --workspace @bijux/ro-crate-web
    - if: ${{ matrix.lane == 'browser' }}
      run: |
        npm run test:local-identity --workspace @bijux/ro-crate-web
        npm run test:local-session --workspace @bijux/ro-crate-web
        DRAFT_REFERENCE_DATABASE_CONTAINER=bijuxauthoringaccounts-database-1 npm run test:local-drafts --workspace @bijux/ro-crate-web
        npm run test:local-journey --workspace @bijux/ro-crate-web
    - if: ${{ matrix.lane == 'history-store' }}
      run: |
        docker run -d --name bijuxhistory-test-postgres -p 15435:5432 -e POSTGRES_PASSWORD=history -e POSTGRES_DB=history postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        for attempt in $(seq 1 60); do
          if docker exec bijuxhistory-test-postgres pg_isready -U postgres -d history >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        exit 1
    - if: ${{ matrix.lane == 'history-store' }}
      run: |
        npm run test:local-history-unit --workspace @bijux/ro-crate-web
        BIJUX_HISTORY_DISPOSABLE=bijux-history-postgres HISTORY_DATABASE_URL=postgresql://postgres:history@127.0.0.1:15435/history npm run test:local-history-store --workspace @bijux/ro-crate-web
    - if: ${{ matrix.lane == 'history-browser' }}
      run: |
        mkdir -p artifacts/history-services
        sed 's/14321/14322/g' ops/local-authoring/realm.json > artifacts/history-services/realm.json
        sed -e 's/15433/15436/g' -e 's/18080/18082/g' ops/local-authoring/compose.yaml > artifacts/history-services/compose.yaml
        docker compose -p bijuxhistory -f artifacts/history-services/compose.yaml up -d --wait
        for attempt in $(seq 1 90); do
          if curl --fail --silent http://127.0.0.1:18082/realms/authoring/.well-known/openid-configuration >/dev/null; then exit 0; fi
          sleep 1
        done
        exit 1
    - if: ${{ matrix.lane == 'history-browser' }}
      run: |
        npm run test:local-history-browser --workspace @bijux/ro-crate-web
        BIJUX_QUAL_WEB_PORT=14322 BIJUX_QUAL_IDENTITY_PORT=18082 BIJUX_QUAL_DATABASE_PORT=15436 npm run test:local-qualification --workspace @bijux/ro-crate-web
    - if: ${{ matrix.lane == 'reference-store' }}
      run: |
        docker run -d --name bijuxreference-store-db -e POSTGRES_PASSWORD=reference -e POSTGRES_DB=reference -p 127.0.0.1:15440:5432 postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        docker run -d --name bijuxreference-store-receiver-db -e POSTGRES_PASSWORD=reference -e POSTGRES_DB=reference -p 127.0.0.1:15441:5432 postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        for attempt in $(seq 1 60); do
          if docker exec bijuxreference-store-db pg_isready -U postgres -d reference >/dev/null 2>&1 && docker exec bijuxreference-store-receiver-db pg_isready -U postgres -d reference >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        exit 1
    - if: ${{ matrix.lane == 'reference-store' }}
      run: |
        BIJUX_SUBMISSION_DISPOSABLE=bijux-submission-postgres SUBMISSION_DATABASE_URL=postgresql://postgres:reference@127.0.0.1:15440/reference BIJUX_REFERENCE_DISPOSABLE=bijux-reference-postgres REFERENCE_DATABASE_URL=postgresql://postgres:reference@127.0.0.1:15441/reference npm run test:local-reference-store --workspace @bijux/ro-crate-web
    - if: ${{ matrix.lane == 'reference-browser' }}
      run: |
        mkdir -p artifacts/reference-services
        sed 's/14321/14325/g' ops/local-authoring/realm.json > artifacts/reference-services/realm.json
        sed -e 's/15433/15440/g' -e 's/18080/18085/g' ops/local-authoring/compose.yaml > artifacts/reference-services/compose.yaml
        docker compose -p bijuxreferencesubmission -f artifacts/reference-services/compose.yaml up -d --wait
        docker run -d --name bijuxreferencesubmission-receiver-db --label bijux.fixture=reference-receiver-postgres -e POSTGRES_PASSWORD=reference -e POSTGRES_DB=reference -p 127.0.0.1:15441:5432 postgres:17.12@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        for attempt in $(seq 1 90); do
          if curl --fail --silent http://127.0.0.1:18085/realms/authoring/.well-known/openid-configuration >/dev/null && docker exec bijuxreferencesubmission-receiver-db pg_isready -U postgres -d reference >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        exit 1
    - if: ${{ matrix.lane == 'reference-browser' }}
      run: |
        BIJUX_REFERENCE_DISPOSABLE=bijux-reference-postgres BIJUX_REFERENCE_CONTAINER=bijuxreferencesubmission-receiver-db REFERENCE_DATABASE_URL=postgresql://postgres:reference@127.0.0.1:15441/reference npm run test:local-reference-browser --workspace @bijux/ro-crate-web
    - if: ${{ always() }}
      run: |
        if test -f ops/local-authoring/compose.yaml; then docker compose -p bijuxauthoringaccounts -f ops/local-authoring/compose.yaml down -v; fi
        if test -f artifacts/history-services/compose.yaml; then docker compose -p bijuxhistory -f artifacts/history-services/compose.yaml down -v; fi
        if test -f artifacts/reference-services/compose.yaml; then docker compose -p bijuxreferencesubmission -f artifacts/reference-services/compose.yaml down -v; fi
        if docker inspect bijuxreferencesubmission-receiver-db >/dev/null 2>&1; then docker rm -f bijuxreferencesubmission-receiver-db; fi
        if docker inspect bijuxreference-store-db >/dev/null 2>&1; then docker rm -f bijuxreference-store-db; fi
        if docker inspect bijuxreference-store-receiver-db >/dev/null 2>&1; then docker rm -f bijuxreference-store-receiver-db; fi
        if docker inspect bijuxhistory-test-postgres >/dev/null 2>&1; then docker rm -f bijuxhistory-test-postgres; fi
        if docker inspect bijuxauthoring-accounts-test-postgres >/dev/null 2>&1; then docker rm -f bijuxauthoring-accounts-test-postgres; fi
  archives:
    if: ${{ always() }}
    needs:
    - packages
    - root-tests
    - source-reports
    - package-types
    - source-parity
    - assets
    - browser-corpus
    - browser-interaction
    - installed
    - authoring-web
    - local-account
    - local-registration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BIJUX_REQUIRED_JOBS: ${{ toJSON(needs) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - run: |-
        mkdir -p artifacts/work artifacts/logs artifacts/reports
        echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.3.0
    - run: node scripts/ci/require-jobs.mjs
    - name: Validate assets producer identity
      env:
        PRODUCER_ARTIFACT_ID: ${{ needs.assets.outputs.artifact_id }}
        PRODUCER_ATTEMPT: ${{ needs.assets.outputs.producer_attempt }}
      run: |
        [[ "$PRODUCER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        printf "Selected artifact %s from producer attempt %s; consumer attempt %s\n" "$PRODUCER_ARTIFACT_ID" "$PRODUCER_ATTEMPT" "$GITHUB_RUN_ATTEMPT"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.assets.outputs.artifact_id }}
        path: artifacts/ci
        merge-multiple: true
    - run: node scripts/ci/runtime-bundles.mjs restore assets "${{ needs.assets.outputs.sha256 }}" "${{ needs.assets.outputs.producer_attempt }}"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: candidate-browser-corpus-*-attempt-*
        path: artifacts/reports/qualification/corpus
    - run: node tests/ci/verify-coverage.mjs browser artifacts/reports/qualification/corpus 8 candidate-browser-corpus
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: candidate-source-node-*
        path: artifacts/reports/qualification/source
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: candidate-source-partitions-*
        path: artifacts/reports/qualification/partition-evidence
    - run: node tests/package/source.mjs --verify
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: candidate-packages-*
        path: artifacts/reports/qualification
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: candidate-installed-node-*
        path: artifacts/reports/qualification
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: candidate-browser-interaction-*
        path: artifacts/reports/qualification
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: candidate-preparation
        path: artifacts/reports/qualification/preparation
    - run: |-
        node tests/package/consumers.mjs --verify
        git rev-parse HEAD > artifacts/reports/candidate-commit.txt
        git rev-parse 'HEAD^{tree}' > artifacts/reports/candidate-tree.txt
        sha256sum package-lock.json > artifacts/reports/package-lock.sha256
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: unpublished-package-candidate-${{ github.sha }}
        path: |-
          artifacts/packages
          artifacts/reports
        if-no-files-found: error
        compression-level: 0
