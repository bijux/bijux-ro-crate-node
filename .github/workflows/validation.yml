name: Validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}packages / node-${{ matrix.node }}"
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.3.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p artifacts/work artifacts/logs
          echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:workspace
      - run: npm run check:types
      - run: npm run test:parity -- --snapshot
      - run: node tests/package/native-inputs.mjs
  reference:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}Python reference"
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_CACHE_DIR: ${{ github.workspace }}/artifacts/cache/uv
      PIP_CACHE_DIR: ${{ github.workspace }}/artifacts/cache/pip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p artifacts/work artifacts/logs artifacts/reports artifacts/tools
          echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.3.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: |
          python -m venv artifacts/tools/uv
          artifacts/tools/uv/bin/pip install uv==0.11.17
          PATH="$PWD/artifacts/tools/uv/bin:$PATH" bash scripts/reference/prepare.sh 2>&1 | tee artifacts/logs/reference-prepare.log
      - run: artifacts/reference/python-env/bin/python scripts/reference/verify-environment.py
      - run: artifacts/reference/python-env/bin/python tests/parity/test_oracle_capture.py
      - run: artifacts/reference/python-env/bin/python tests/reference/test_ontology_preparation.py
      - name: Verify context parsing against locked RDFLib
        run: |
          artifacts/reference/python-env/bin/python scripts/reference/capture-jsonld-contexts.py --output artifacts/reports/jsonld-contexts.json
          cmp tests/parity/expected/jsonld-contexts.json artifacts/reports/jsonld-contexts.json
      - name: Verify literal expectations against locked RDFLib
        run: |
          artifacts/reference/python-env/bin/python scripts/reference/capture-literal-identities.py --output artifacts/reports/literal-identities.json
          cmp tests/parity/expected/literal-identities.json artifacts/reports/literal-identities.json
      - name: Verify markup identities and serialization constants
        run: |
          artifacts/reference/python-env/bin/python scripts/reference/capture-markup-identities.py --output artifacts/reports/markup-identities.json
          cmp tests/parity/expected/markup-identities.json artifacts/reports/markup-identities.json
      - name: Verify generated profile entailments
        run: |
          artifacts/reference/python-env/bin/python scripts/reference/export-profile.py
          artifacts/reference/python-env/bin/python tests/parity/generators/generate-profile-inference.py
          git diff --exit-code -- packages/validator/src/profile/shapes.json packages/validator/src/profile/ontology.json \
            packages/validator/src/profile/inference/datatypes.json packages/validator/src/profile/inference/axioms.json \
            tests/parity/expected/profile-inference.json
      - name: Verify generated URL and manifest boundaries
        run: |
          artifacts/reference/python-env/bin/python tests/parity/generators/generate-url-cases.py
          artifacts/reference/python-env/bin/python tests/parity/generators/generate-manifest-values.py
          artifacts/reference/python-env/bin/python tests/parity/generators/generate-tsv-records.py
          git diff --exit-code -- tests/parity/expected/url-cases.json tests/parity/expected/manifest-values.json tests/parity/expected/tsv-records.json
      - name: Prepare the pinned ontology compiler with bounded retries
        run: artifacts/reference/python-env/bin/python scripts/reference/prepare-ontology.py
      - run: artifacts/reference/python-env/bin/python artifacts/reference/python/scripts/ontology/check_ontology.py --install
      - run: artifacts/reference/python-env/bin/python -m pytest artifacts/reference/python/test --basetemp=artifacts/work/upstream-tests -o cache_dir=artifacts/cache/pytest
      - run: npm run build
      - run: npm run test:parity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-reference
          path: |
            artifacts/reports
            artifacts/logs
          if-no-files-found: warn
  browsers:
    name: "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}Browser validation and draft lifecycle"
    if: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/tools/browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p artifacts/work artifacts/logs artifacts/reports
          echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.3.0'
      - run: npm ci
      - name: Use the signed Ubuntu archive over HTTPS
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          for pattern in ('sources.list', 'sources.list.d/*.list', 'sources.list.d/*.sources'):
              for path in Path('/etc/apt').glob(pattern):
                  original = path.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      path.write_text(updated)
          PYTHON
      - run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 8
      - run: npm run build
      - run: npm run test:browser
      - run: node tests/browser/continuation-parity.mjs
      - run: node tests/browser/native-file-values.mjs
      - run: npm run test:live
      - run: node tests/browser/races.mjs
      - run: node tests/browser/session/termination.mjs
      - run: node tests/browser/draft-editor.mjs
      - run: node tests/browser/offline.mjs
      - run: node tests/browser/report-display.mjs
      - run: npm run test:workload
      - run: npm run test:pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-validation
          path: |
            artifacts/reports
            artifacts/packages
          if-no-files-found: warn
