name: Local draft history
'on':
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: local-draft-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: history
          POSTGRES_DB: history
        ports:
        - 15435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d history"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      HISTORY_DATABASE_URL: postgresql://postgres:history@127.0.0.1:15435/history
      BIJUX_HISTORY_DISPOSABLE: bijux-history-postgres
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - run: mkdir -p artifacts/work && echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - run: npm ci
    - run: npm run build
    - run: npm run test:local-history-unit --workspace @bijux/ro-crate-web
    - run: npm run test:local-history-store --workspace @bijux/ro-crate-web
  history-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - run: mkdir -p artifacts/work artifacts/history-services && echo "TMPDIR=$PWD/artifacts/work" >> "$GITHUB_ENV"
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build && npm run build --workspace @bijux/ro-crate-web
    - name: Start isolated local reference
      run: |
        sed 's/14321/14322/g' ops/local-authoring/realm.json > artifacts/history-services/realm.json
        sed -e 's/15433/15436/g' -e 's/18080/18082/g' ops/local-authoring/compose.yaml > artifacts/history-services/compose.yaml
        docker compose -p bijuxhistory -f artifacts/history-services/compose.yaml up -d --wait
        for attempt in {1..90}; do
          if curl -fsS http://127.0.0.1:18082/realms/authoring/.well-known/openid-configuration >/dev/null; then exit 0; fi
          sleep 1
        done
        exit 1
    - run: npm run test:local-history-browser --workspace @bijux/ro-crate-web
